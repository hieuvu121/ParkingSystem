spring.application.name=app
spring.datasource.url=jdbc:postgresql://localhost:5432/parkingSystem
spring.datasource.username=${PGDB_USERNAME}
spring.datasource.password=${PGDB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# App
app.base-url=http://localhost:8080
app.websocket.allowed-origins=http://localhost:5175,http://127.0.0.1:5175

# OpenAI
openai.api-key=${OPEN_AI_KEY}
openai.model=gpt-4o-mini

# OpenWeatherMap
weather.api-key=${OPENWEATHER_API_KEY}
weather.default-lat=10.7769
weather.default-lng=106.7009
